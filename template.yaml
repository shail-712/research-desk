AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Research Desk - API Gateway HTTP API + Lambda (one container image) for Quick / Deep research
  answers, DynamoDB single table (provisioned 2/2, TTL, Streams), FAISS index on S3 (Retain),
  price alerts (EventBridge Scheduler -> scan -> DynamoDB Stream -> Telegram, SQS DLQ + alarm),
  SSM SecureString secrets, 14-day logs, $1 budget. Region ap-southeast-2 (D17). See docs/SPEC.md §3.
  Adapted from v1 template.yaml (73b6fda): digest/SES, filing resources, X-Ray and the dashboard
  cut (D3, D13); Retain on the data bucket. The ECR repository (keep-2 lifecycle) is the
  separate stack infra/ecr.yaml, deployed first (D15).

Parameters:
  AlertEmail:
    Type: String
    Default: ""
    Description: Email for the budget alert (and alarms). Blank = no budget / no email.
  SsmPath:
    Type: String
    Default: /research-desk
    AllowedPattern: '^/[A-Za-z0-9_./-]*[A-Za-z0-9_.-]$'
    Description: SSM Parameter Store path (no trailing slash) holding the SecureString secrets.
  BudgetLimitUsd:
    Type: Number
    Default: 1
  EnableWatchdog:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      "true" adds the price-alert path (scan, notify, Scheduler, Stream mapping, DLQ + alarm).
      I1 deploys with "false"; I3 turns it on (docs/ITERATIONS.md).

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  WatchdogEnabled: !Equals [!Ref EnableWatchdog, "true"]

Globals:
  Function:
    Architectures: [x86_64]
    MemorySize: 1024
    Timeout: 30
    Environment:
      Variables:
        STORE_BACKEND: dynamodb
        DDB_TABLE: !Ref Table
        VECTOR_BACKEND: s3
        VECTOR_BUCKET: !Ref DataBucket
        VECTOR_KEY: vectors/index.npz
        SSM_PREFIX: !Ref SsmPath
        # Lambda's filesystem is read-only except /tmp (SEC ticker list, query-embedding cache).
        CACHE_DIR: /tmp/research-desk
        EMBED_CACHE_PATH: /tmp/research-desk/embeddings.sqlite
        DEEP_BUDGET_SECONDS: "75"
        LOG_LEVEL: INFO

Resources:
  # ── Data ────────────────────────────────────────────────────────────────────
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PROVISIONED          # the always-free tier covers provisioned capacity, not on-demand
      ProvisionedThroughput: {ReadCapacityUnits: 2, WriteCapacityUnits: 2}
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      # Only the Watchdog's notify function reads the stream. Turning it on in I3 is an in-place
      # update (no table replacement).
      StreamSpecification: !If [WatchdogEnabled, {StreamViewType: NEW_IMAGE}, !Ref AWS::NoValue]

  # The FAISS index (vectors/index.npz). It cost embedding quota to build (D11), so it outlives
  # the stack: `sam delete` leaves it, and it is deleted by hand when the project ends.
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]

  # ── API ─────────────────────────────────────────────────────────────────────
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10       # protects the free Gemini / Yahoo / Finnhub quotas
        ThrottlingRateLimit: 5

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig: {Command: ["aws_lambda.api.handler"]}
      MemorySize: 512
      Timeout: 29                      # just under API Gateway's 30 s integration limit
      Environment:
        Variables:
          ASK_WORKER_FUNCTION: !Ref AskWorkerFunction
          # Each function reads only the secrets it needs (review I3, finding 2). Keep this list and
          # the ssm:GetParameters resources below the same (test_template.py checks it).
          SSM_SECRETS: APP_ACCESS_CODE,FINNHUB_API_KEY,SEC_USER_AGENT
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - LambdaInvokePolicy: {FunctionName: !Ref AskWorkerFunction}
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameters]
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPath}/APP_ACCESS_CODE"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPath}/FINNHUB_API_KEY"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPath}/SEC_USER_AGENT"
            - &kmsDecrypt
              Effect: Allow
              Action: [kms:Decrypt]          # SecureString with the AWS-managed aws/ssm key
              Resource: "*"
              Condition:
                StringEquals: {"kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com"}
      Events:
        Proxy:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: "/{proxy+}", Method: ANY}
    Metadata: &image
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: python3.12-v2

  AskWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig: {Command: ["aws_lambda.ask_worker.handler"]}
      Timeout: 120                     # Deep mode budget is 75 s
      EventInvokeConfig:
        MaximumRetryAttempts: 0        # the job item records failures; don't rerun long LLM work
      Environment:
        Variables:
          SSM_SECRETS: GEMINI_API_KEY,FINNHUB_API_KEY,SEC_USER_AGENT
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - Statement:
            - Effect: Allow            # read-only, and only the index object (HeadObject needs GetObject)
              Action: [s3:GetObject]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${DataBucket}/vectors/*"
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameters]
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPath}/GEMINI_API_KEY"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPath}/FINNHUB_API_KEY"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPath}/SEC_USER_AGENT"
            - *kmsDecrypt
    Metadata: *image

  # ── Price alerts: Scheduler -> scan -> DynamoDB -> Stream -> notify -> Telegram ──
  # Only with EnableWatchdog=true. SAM copies a function's Condition to the resources it generates
  # (the Scheduler schedule, the Stream event-source mapping, roles).
  ScanFunction:
    Type: AWS::Serverless::Function
    Condition: WatchdogEnabled
    Properties:
      PackageType: Image
      ImageConfig: {Command: ["aws_lambda.scan.handler"]}
      Timeout: 120                     # one batched quote call + at most a few 25 s "why" picks
      Environment:
        Variables:
          SSM_SECRETS: GEMINI_API_KEY,FINNHUB_API_KEY   # quotes + the "why"; no SEC, no Telegram on AWS
      Policies:
        - Statement:
            # Exactly what the scan path calls (review I3, finding 3): the watchlist (Query), the
            # dedupe check (GetItem) and the dedupe transaction's two Puts (PutItem). Delivery is
            # NotifyFunction's job on AWS (notify=False), so no UpdateItem here.
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt Table.Arn
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameters]
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPath}/GEMINI_API_KEY"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPath}/FINNHUB_API_KEY"
            - *kmsDecrypt
      Events:
        MarketHours:
          Type: ScheduleV2
          Properties:
            # Every 15 min, 9:00-16:45 New York, Mon-Fri; the handler drops runs outside
            # 9:30-16:00, so DST needs no second cron. Holidays: no session -> no alert (D12).
            ScheduleExpression: "cron(*/15 9-16 ? * MON-FRI *)"
            ScheduleExpressionTimezone: America/New_York
            Input: '{"source": "schedule"}'
            RetryPolicy: {MaximumRetryAttempts: 0}   # the next run is 15 min away anyway
    Metadata: *image

  NotifyFunction:
    Type: AWS::Serverless::Function
    Condition: WatchdogEnabled
    Properties:
      PackageType: Image
      ImageConfig: {Command: ["aws_lambda.notify.handler"]}
      MemorySize: 512
      Environment:
        Variables:
          SSM_SECRETS: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
      Policies:
        - Statement:
            - Effect: Allow            # only marks FEED items as notified
              Action: [dynamodb:UpdateItem]
              Resource: !GetAtt Table.Arn
            # Stream read on this table's stream only (review I3, finding 4). SAM's DynamoDB event
            # would attach AWSLambdaDynamoDBExecutionRole (stream read on "*"), so the mapping below
            # is declared directly. ListStreams can't be scoped to a resource.
            - Effect: Allow
              Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator]
              Resource: !GetAtt Table.StreamArn
            - Effect: Allow
              Action: [dynamodb:ListStreams]
              Resource: "*"
        - SQSSendMessagePolicy: {QueueName: !GetAtt NotifyDLQ.QueueName}
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameters]
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPath}/TELEGRAM_BOT_TOKEN"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPath}/TELEGRAM_CHAT_ID"
            - *kmsDecrypt
    Metadata: *image

  # Stream -> NotifyFunction. Same logical ID and settings as the mapping SAM generated from the old
  # `Events: NewAlerts` (I3), so CloudFormation updates it in place instead of replacing it.
  NotifyFunctionNewAlerts:
    Type: AWS::Lambda::EventSourceMapping
    Condition: WatchdogEnabled
    Properties:
      FunctionName: !Ref NotifyFunction
      EventSourceArn: !GetAtt Table.StreamArn
      StartingPosition: LATEST
      BatchSize: 10
      MaximumRetryAttempts: 3
      MaximumRecordAgeInSeconds: 3600
      FunctionResponseTypes: [ReportBatchItemFailures]
      DestinationConfig:
        OnFailure: {Destination: !GetAtt NotifyDLQ.Arn}
      FilterCriteria:                  # only new alerts reach the function (no invocations for jobs/state)
        Filters:
          - Pattern: '{"eventName": ["INSERT"], "dynamodb": {"NewImage": {"pk": {"S": ["FEED"]}}}}'

  NotifyDLQ:
    Type: AWS::SQS::Queue
    Condition: WatchdogEnabled
    Properties:
      MessageRetentionPeriod: 1209600   # 14 days to inspect failed alerts
      SqsManagedSseEnabled: true

  # ── Alarms -> email ─────────────────────────────────────────────────────────
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription: !If
        - HasAlertEmail
        - [{Endpoint: !Ref AlertEmail, Protocol: email}]
        - !Ref AWS::NoValue

  FailedAlertsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WatchdogEnabled
    Properties:
      AlarmDescription: Alerts that Telegram rejected after all retries are waiting in the DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt NotifyDLQ.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # I4. Thresholds are set so one Gemini quota blip never emails: Gemini isn't on the API path, the
  # worker catches answer failures itself (they are AskErrors, not Lambda Errors), and the scan
  # never fails over a "why".
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API returned 5xx at least twice in 5 minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{Name: ApiId, Value: !Ref HttpApi}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  AskErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: At least 3 answers (Quick + Deep) failed in 15 minutes (EMF AskErrors).
      Metrics:
        - Id: quick
          ReturnData: false
          MetricStat:
            Metric: {Namespace: ResearchDesk, MetricName: AskErrors, Dimensions: [{Name: Mode, Value: quick}]}
            Period: 900
            Stat: Sum
        - Id: deep
          ReturnData: false
          MetricStat:
            Metric: {Namespace: ResearchDesk, MetricName: AskErrors, Dimensions: [{Name: Mode, Value: deep}]}
            Period: 900
            Stat: Sum
        - Id: total
          Label: AskErrors, Quick + Deep
          Expression: FILL(quick, 0) + FILL(deep, 0)
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The ask worker crashed or timed out at least twice in 15 minutes (Lambda Errors).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref AskWorkerFunction}]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ScanErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WatchdogEnabled
    Properties:
      AlarmDescription: The price scan failed in two 15-minute periods in a row (Lambda Errors).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ScanFunction}]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # ── Logs: 14-day retention (log groups otherwise keep data forever) ─────────
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/${ApiFunction}", RetentionInDays: 14}
  AskWorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/lambda/${AskWorkerFunction}", RetentionInDays: 14}
  ScanLogs:
    Type: AWS::Logs::LogGroup
    Condition: WatchdogEnabled
    Properties: {LogGroupName: !Sub "/aws/lambda/${ScanFunction}", RetentionInDays: 14}
  NotifyLogs:
    Type: AWS::Logs::LogGroup
    Condition: WatchdogEnabled
    Properties: {LogGroupName: !Sub "/aws/lambda/${NotifyFunction}", RetentionInDays: 14}

  # ── Cost guard ──────────────────────────────────────────────────────────────
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref BudgetLimitUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]

Outputs:
  ApiUrl:
    Description: Base URL for Postman ({{base_url}}) and Streamlit (DESK_API_URL).
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  TableName:
    Value: !Ref Table
  DataBucketName:
    Value: !Ref DataBucket
  ScanFunctionName:
    Condition: WatchdogEnabled
    Description: 'For the replay demo: aws lambda invoke with {"replay": "INTC:-7.5"}'
    Value: !Ref ScanFunction
  NotifyDLQUrl:
    Condition: WatchdogEnabled
    Value: !Ref NotifyDLQ
